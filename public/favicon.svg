<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="64" y1="320" x2="448" y2="320" stroke="#1e293b" stroke-width="2"/>
  <line x1="64" y1="240" x2="448" y2="240" stroke="#1e293b" stroke-width="1" stroke-dasharray="8,8"/>
  <line x1="64" y1="160" x2="448" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="8,8"/>

  <!-- Bar chart — 3 bars representing aggregated sources -->
  <!-- Bar 1 (left) -->
  <rect x="100" y="200" width="72" height="120" rx="8" fill="url(#barGrad1)"/>
  <!-- Bar 2 (middle, tallest = aggregate) -->
  <rect x="220" y="128" width="72" height="192" rx="8" fill="url(#arrowGrad)"/>
  <!-- Bar 3 (right) -->
  <rect x="340" y="176" width="72" height="144" rx="8" fill="url(#barGrad2)"/>

  <!-- Baseline -->
  <rect x="80" y="318" width="352" height="4" rx="2" fill="#334155"/>

  <!-- Wind vane arrow on top of middle bar -->
  <!-- Vertical pole -->
  <rect x="252" y="64" width="8" height="72" rx="4" fill="#38bdf8"/>

  <!-- Arrow head (pointing right = wind from west) -->
  <polygon points="310,68 270,52 270,84" fill="#38bdf8"/>
  <!-- Arrow tail -->
  <rect x="218" y="64" width="52" height="8" rx="4" fill="#38bdf8" opacity="0.5"/>

  <!-- Dot at top of pole -->
  <circle cx="256" cy="68" r="6" fill="#f1f5f9"/>

  <!-- Aggregate indicator — small dot above middle bar -->
  <circle cx="256" cy="112" r="10" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="256" cy="112" r="5" fill="#38bdf8"/>
</svg>
